# SCADA Traffic Generator - Configuracao IEC 104

engine:
  stats_interval: 10        # Relatorio de stats a cada N segundos
  retry_delay: 5             # Delay entre reconexoes
  max_retries: -1            # -1 = infinito
  log_level: INFO            # DEBUG para ver cada frame

# ---------------------------------------------------------------------------
# Condicoes de rede simuladas (aplicadas ao envio de cada frame)
# ---------------------------------------------------------------------------
# preset: ideal | lan | wan | wan_degraded | lossy
# Parametros manuais sobrepoem o preset se especificados.
#
# Presets:
#   ideal:        latency=0ms,  jitter=0ms,  loss=0%,   corruption=0%
#   lan:          latency=1ms,  jitter=0.5ms, loss=0%,  corruption=0%
#   wan:          latency=50ms, jitter=10ms, loss=0%,   corruption=0%
#   wan_degraded: latency=100ms,jitter=30ms, loss=2%,   corruption=0.1%
#   lossy:        latency=200ms,jitter=50ms, loss=10%,  corruption=0.5%
# ---------------------------------------------------------------------------
network_conditions:
  preset: "ideal"
  # latency_ms: 50
  # jitter_ms: 10
  # packet_loss_rate: 0.01
  # corruption_rate: 0.001

# ---------------------------------------------------------------------------
# Perfil de geracao de carga
# ---------------------------------------------------------------------------
# type: constant | poisson | burst | sinusoidal
#
#   constant:    intervalos fixos (padrao)
#   poisson:     intervalos exponencialmente distribuidos (media = base_interval)
#   burst:       rajadas de burst_count eventos em burst_duration_s segundos,
#                repetidas a cada burst_every_s segundos
#   sinusoidal:  taxa varia com senoide de period_s segundos
# ---------------------------------------------------------------------------
load_profile:
  type: "constant"                # intervalo fixo de 5s (espacamento uniforme, sem rajadas)
  # Para burst:
  # burst_count: 10
  # burst_duration_s: 2.0
  # burst_every_s: 60.0
  # Para sinusoidal:
  # period_s: 300.0

iec104:
  enabled: true

  slave:
    host: "127.0.0.1"
    port: 2404
    common_address: 1
    originator: 0
    t1: 15
    t2: 10
    t3: 20
    k: 12
    w: 8
    spontaneous_interval: 5.0     # Geracao de eventos: em media 5s (perfil poisson)
    periodic_interval: 15.0       # Scan periodico (COT=PERIODIC) a cada 15s
    gi_response_delay: 0.05       # Delay entre objetos no GI
    # Condicoes de rede especificas para o slave (opcional, sobrepoem o global)
    # network_conditions:
    #   preset: "wan"
    # Perfil de carga especifico para o slave (opcional)
    # load_profile:
    #   type: "poisson"
    # Datapoints: vazio = usa defaults internos (12 pontos)
    # Para customizar:
    # datapoints:
    #   - ioa: 100
    #     type_id: 1          # M_SP_NA_1
    #     value: false
    #     change_prob: 0.02
    #   - ioa: 200
    #     type_id: 13         # M_ME_NC_1
    #     value: 138.5
    #     min: 120.0
    #     max: 145.0
    #     noise: 2.0
    #     drift: 0.5

  master:
    host: "127.0.0.1"
    port: 2404
    common_address: 1
    originator: 0
    startup_delay: 1.5             # Aguarda slave subir
    t1: 15
    t2: 10
    t3: 20
    k: 12
    w: 8
    gi_interval: 90.0              # Interrogacao geral a cada 90s
    command_interval: 25.0         # Comando a cada 25s
    clock_sync_interval: 180.0    # Clock sync a cada 3min
    testfr_interval: 45.0         # Heartbeat a cada 45s
    command_ioas: [100, 101, 102, 103]
    # Condicoes de rede especificas para o master (opcional)
    # network_conditions:
    #   preset: "wan"
    # Perfil de carga especifico para o master (opcional)
    # load_profile:
    #   type: "burst"
    #   burst_count: 5
    #   burst_every_s: 30.0

# ---------------------------------------------------------------------------
# Fase 2 - DNP3 (IEEE 1815-2012), porta 20000
# ---------------------------------------------------------------------------
dnp3:
  enabled: true

  outstation:
    host: "127.0.0.1"
    port: 20000
    address: 4                    # endereco do outstation (data link)
    master_address: 1
    event_scan_interval: 5.0      # Geracao de eventos: em media 5s (perfil poisson)
    unsolicited_enabled: true     # envio espontaneo sem poll do master
    unsolicited_interval: 15.0
    max_events_per_response: 20
    # points: vazio = usa a base padrao (13 pontos de subestacao)
    # points:
    #   - index: 0
    #     group: 1                # 1=Binary Input, 20=Counter, 30=Analog Input
    #     value: false
    #     class: 1                # classe de evento (1=alta, 2=media, 3=baixa)
    #     change_prob: 0.02
    #   - index: 0
    #     group: 30
    #     value: 138.5
    #     class: 2
    #     min: 120.0
    #     max: 145.0
    #     noise: 2.0
    #     deadband: 0.01          # fracao do range para gerar evento

  master:
    host: "127.0.0.1"
    port: 20000
    address: 1
    outstation_address: 4
    startup_delay: 2.0
    integrity_interval: 90.0      # Integrity Poll (Class 0)
    event_poll_interval: 8.0      # varredura de eventos (Class 1/2/3)
    command_interval: 30.0
    clock_sync_interval: 120.0
    command_indexes: [0, 1]       # indices de Binary Output comandados
    use_sbo: true                 # Select-Before-Operate (false = Direct Operate)

# ---------------------------------------------------------------------------
# Fase 3 - OPC-UA (IEC 62541), porta 4840
# ---------------------------------------------------------------------------
opcua:
  enabled: true

  server:
    host: "127.0.0.1"
    port: 4840
    uri: "http://ime.eb.br/pfc/scada"
    update_interval: 5.0          # Geracao de eventos: em media 5s (perfil poisson)

  client:
    url: "opc.tcp://127.0.0.1:4840/scada/server/"
    startup_delay: 4.0            # aguarda o server subir
    publishing_interval: 5000.0   # ms, intervalo da Subscription (5s, menos chatter)
    browse_interval: 90.0         # Browse periodico do Address Space
    read_interval: 15.0           # Read explicito de todos os nos
    write_interval: 35.0          # Write em setpoint

# ---------------------------------------------------------------------------
# Gateway Modbus-TCP (janela de leitura p/ o SCADA-LTS montar a HMI)
# ---------------------------------------------------------------------------
# O SCADA-LTS nao fala IEC 60870-5-104; fala Modbus TCP. Este gateway le, em
# tempo real, os datapoints que os slaves do simulador (iec104 slave, dnp3
# outstation, opcua server) mantem em memoria e os publica como coils (booleanos)
# e holding registers (analogicos float32, 2 registradores por ponto). O
# SCADA-LTS conecta como mestre Modbus e faz polling. NAO altera o trafego
# IEC104/DNP3/OPC-UA original - apenas espelha o estado para leitura.
#
# O mapa de enderecos e impresso no log ao subir (procure "MAPA DE REGISTRADORES").
# ---------------------------------------------------------------------------
modbus:
  enabled: true
  host: "0.0.0.0"       # 0.0.0.0 aceita o SCADA-LTS de outra maquina/VM
  port: 5020            # porta Modbus TCP (502 exige admin; 5020 nao)
  unit_id: 1            # slave/unit id que o SCADA-LTS deve usar
  allow_writes: false   # read-only (padrao). true reabilita comando da HMI (FC05/FC16) -> ponto do slave
  sources: []           # vazio = auto: espelha todos os slaves. Ou liste nomes:
                        #   ["iec104-slave", "dnp3-outstation"]

# ---------------------------------------------------------------------------
# Modelo de processo (Passo 2 - comportamento fisico coerente)
# ---------------------------------------------------------------------------
# Sem isto, cada ponto varia sozinho (senoide/ruido) sem sentido fisico. Com isto,
# os pontos dos tres protocolos passam a refletir UMA subestacao coerente:
#   disjuntor aberto -> corrente do alimentador cai a ~0
#   corrente -> potencia (P~V*I) e afunda a tensao da barra (queda com a carga)
#   regulador de tap corrige a tensao; carga -> temperatura do trafo (atraso termico)
#   trips espontaneos + religamento; comando da HMI/MITM abre/fecha e a cascata reage
# ---------------------------------------------------------------------------
process_model:
  enabled: true
  tick_s: 1.0           # passo da fisica e do refresh dos pontos (s)
  feeder1_load: 450.0   # corrente nominal do alimentador 1 (A)
  feeder2_load: 320.0   # corrente nominal do alimentador 2 (A)
  bus_a_kv: 138.5       # tensao nominal da barra AT (kV)
  bus_b_kv: 69.0        # tensao nominal da barra MT (kV)
  setpoint_kv: 138.0    # setpoint do regulador de tap (kV)
  ambient_c: 25.0       # temperatura ambiente (C)
  thermal_tau_s: 90.0   # constante de tempo termica do trafo (s)
  trip_rate: 0.0008     # prob. de trip espontaneo por disjuntor por segundo
  reclose_s: 20.0       # tempo de religamento automatico apos trip (s)
