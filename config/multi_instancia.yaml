# ===========================================================================
# Exemplo do formato MULTI-INSTANCIA (Fase 2 do PLANEJAMENTO_MULTIMAQUINA.md).
#
# Em vez dos blocos fixos `slave`/`master`, cada protocolo declara uma lista
# `nodes`, e cada item vira um gerador proprio (nome `<proto>-<id>`). Assim da
# para subir VARIOS slaves e VARIOS masters do mesmo protocolo.
#
#   python main.py -c config/multi_instancia.yaml
#
# O formato antigo (config/default.yaml) continua valido; este e opt-in.
# ===========================================================================

engine:
  stats_interval: 10
  retry_delay: 5
  max_retries: -1

network_conditions:
  preset: "ideal"

load_profile:
  type: "constant"

# ---------------------------------------------------------------------------
# IEC 104 - dois pares independentes (cada master no seu slave, portas distintas)
# ---------------------------------------------------------------------------
iec104:
  enabled: true
  nodes:
    - { id: slave-1,  role: slave,  host: 127.0.0.1, port: 2404, common_address: 1,
        spontaneous_interval: 5.0, periodic_interval: 15.0 }
    - { id: slave-2,  role: slave,  host: 127.0.0.1, port: 2414, common_address: 2,
        spontaneous_interval: 5.0, periodic_interval: 15.0 }
    - { id: master-1, role: master, host: 127.0.0.1, port: 2404, common_address: 1,
        startup_delay: 1.5 }
    - { id: master-2, role: master, host: 127.0.0.1, port: 2414, common_address: 2,
        startup_delay: 1.5 }

# ---------------------------------------------------------------------------
# DNP3 - um outstation servindo DOIS masters (o outstation agora e multi-cliente)
# ---------------------------------------------------------------------------
dnp3:
  enabled: true
  nodes:
    - { id: outstation-1, role: outstation, host: 127.0.0.1, port: 20000,
        address: 4, master_address: 1, event_scan_interval: 5.0 }
    - { id: master-1, role: master, host: 127.0.0.1, port: 20000,
        address: 1, outstation_address: 4, startup_delay: 2.0 }
    - { id: master-2, role: master, host: 127.0.0.1, port: 20000,
        address: 2, outstation_address: 4, startup_delay: 2.5 }

# ---------------------------------------------------------------------------
# OPC-UA - dois clientes no mesmo servidor (o server asyncua e multi-session)
# ---------------------------------------------------------------------------
opcua:
  enabled: true
  nodes:
    - { id: server-1, role: server, host: 127.0.0.1, port: 4840,
        uri: "http://ime.eb.br/pfc/scada", update_interval: 5.0 }
    - { id: client-1, role: client, url: "opc.tcp://127.0.0.1:4840/scada/server/",
        startup_delay: 4.0, publishing_interval: 5000.0 }
    - { id: client-2, role: client, url: "opc.tcp://127.0.0.1:4840/scada/server/",
        startup_delay: 5.0, publishing_interval: 5000.0 }
