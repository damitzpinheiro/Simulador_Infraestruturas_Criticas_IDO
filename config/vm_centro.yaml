# VM-CENTRO (bairro, DNP3). Outstation :20000 + plant_link :7070 + Modbus :5020.
#   python main.py -c config/vm_centro.yaml
engine: { stats_interval: 20, log_level: INFO }
network_conditions: { preset: ideal }
load_profile: { type: constant }
dnp3:
  enabled: true
  nodes:
    - id: centro
      role: outstation
      grid_entity: centro
      bind: 0.0.0.0
      port: 20000
      address: 4
      master_address: 1
      points:
        - { index: 0, group: 1,  value: true }
        - { index: 1, group: 30, value: 69.0, min: 0.0, max: 75.0,  noise: 0.0 }
        - { index: 2, group: 30, value: 418.0, min: 0.0, max: 900.0, noise: 0.0 }
        - { index: 3, group: 30, value: 50.0, min: 0.0, max: 70.0,  noise: 0.0 }
plant_link: { enabled: true, host: 0.0.0.0, port: 7070, tick_s: 1.0 }
modbus:     { enabled: true, host: 0.0.0.0, port: 5020, unit_id: 1, allow_writes: false }
