# ===========================================================================
# VM-CENTRO-DE-CONTROLE (o operador). So os masters/clientes que polam os RTUs.
# SEM comandos legitimos (command_ioas/indexes vazios) p/ so o ATAQUE injetar.
# Para o Caso 1, aponte o master da termica para o IP do MITM (mitm.py), nao p/ o RTU.
#   python main.py -c config/vm_centro_controle.yaml
# ===========================================================================
engine: { stats_interval: 20, log_level: INFO }
network_conditions: { preset: ideal }
load_profile: { type: constant }
iec104:
  enabled: true
  nodes:
    - { id: op-termica, role: master, host: 192.168.21.12, port: 2404,
        common_address: 1, startup_delay: 2.0, gi_interval: 60.0, t1: 40,
        command_interval: 999999, command_ioas: [] }   # t1 folgado: absorve o salto do MITM (proxy)
    - { id: op-industrial, role: master, host: 192.168.21.13, port: 2404,
        common_address: 1, startup_delay: 2.0, gi_interval: 60.0,
        command_interval: 999999, command_ioas: [] }
dnp3:
  enabled: true
  nodes:
    - { id: op-centro, role: master, host: 192.168.21.14, port: 20000,
        address: 1, outstation_address: 4, startup_delay: 2.5,
        integrity_interval: 60.0, command_interval: 999999, command_indexes: [] }
    - { id: op-hospital, role: master, host: 192.168.21.15, port: 20000,
        address: 1, outstation_address: 5, startup_delay: 2.5,
        integrity_interval: 60.0, command_interval: 999999, command_indexes: [] }
opcua:
  enabled: true
  nodes:
    - { id: op-hidro, role: client, url: "opc.tcp://192.168.21.11:4840/scada/server/",
        startup_delay: 5.0, publishing_interval: 5000.0, read_interval: 10.0,
        write_interval: 999999 }
